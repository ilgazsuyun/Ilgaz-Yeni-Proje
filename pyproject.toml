[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parazit"
version = "0.1.0"
description = "İç içe geçmiş matrisleri ayrıştıran araç: ses/görüntü -> matris -> anlamlı parçalar"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10.0"]

[project.scripts]
parazit = "parazit.cli:main"

[tool.setuptools]
packages = ["parazit"]
